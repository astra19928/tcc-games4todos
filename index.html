<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahahaha</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <main class="site-container flex-container">
        
        <section class="header">

            <div class="header-top flex-container">

                <div class="header-user flex-container">
                
                    <div class="icon-container">
                        <img class="icon" src="Vector.svg">
                    </div>

                    <t>Login</t>
                </div>

                <div class="logo-padding">
                    <div class="logo">
                        <t>Games4Todos</t>
                    </div>
                </div>

                <div class="header-user flex-container hidden">
                
                    <div class="icon-container">
                        <img class="icon" src="Vector.svg">
                    </div>

                    <t>Login</t>
                </div>
            </div>

            <div class="header-bottom flex-container">
                <div class="header-action flex-container">
                    <span class="material-symbols-outlined">star</span>

                    <t>Favoritos</t>
                </div>

                <div class="header-action flex-container">
                    <span class="material-symbols-outlined">comment</span>

                    <t>Respostas</t>
                </div>

                <div class="header-action search-bar flex-container">
                    <label for="search-submit" class="search-icon">
                        <span class="material-symbols-outlined">search</span>
                    </label>
                    

                    <form action="/search" method="GET" role="search">
                        <input 
                            type="search" 
                            id="site-search" 
                            class="search-bar-input"
                            name="q" 
                            placeholder="Pesquisar" 
                            aria-label="Pesquisepor um mod"
                        />
                        <button type="submit" id="search-submit" style="display: none;"></button>
                    </form>

                </div>
            </div>

        </section>

    </main>

</body>
</html>
