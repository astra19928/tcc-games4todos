<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
            rel="stylesheet" />
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/search.css">
    <script src="/js/loadUser.js" type="module"></script>
    <script src="/js/loadHeader.js" type="module"></script>
</head>

<body>
    <main class="site-container flex-container-column">
        <header id="header" class="header"></header>

        <article class="site-body flex-container-column">

            <div class="search-bar page-search-bar flex-container">
                <label for="page-search-submit" class="search-icon">
                    <span class="material-symbols-outlined">search</span>
                </label>

                <form class="search-form" action="/search" method="GET" role="search">
                    <input
                            type="search"
                            id="page-site-search"
                            class="search-bar-input"
                            name="query"
                            th:value="${query}"
                            placeholder="Pesquisar (ir pagina mod, temporario)"
                            aria-label="Pesquise por um mod"
                    />
                    <button type="submit" id="page-search-submit" style="display: none;"></button>
                </form>

            </div>

            <p th:if="${mods == null or mods.isEmpty()}">Nenhum mod encontrado!</p>

            <section th:if="${mods != null and !mods.isEmpty()}" class="flex-container-column">

                <div th:each="modification : ${mods}" class="search-result-container flex-container">
                    <img th:src="${modification.getModIconSrc()}" class = "card-image" alt="Capa do Mod">

                    <div class="search-result-text-container flex-container-column">
                        <a th:href="${modification.getHref()}" th:text="${modification.getFullTitle()}">MISSING TITLE</a>

                        <p th:text="${modification.nameDevelopers}">MISSING DEVELOPERS</p>
                        <p th:text="${modification.formatFileSize() + ' - ' + modification.releaseDate}">MISSING RELEASE DATE</p>
                        <p th:text="${modification.description}">boo!!! :3</p>
                    </div>
                </div>

            </section>

        </article>
    </main>
</body>

</html>
