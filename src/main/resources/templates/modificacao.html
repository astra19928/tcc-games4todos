<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modName}">Nome do Mod Aqui</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/modificacao.css">
    <script src="/js/loadUser.js" type="module"></script>
    <script src="/js/loadHeader.js" type="module"></script>
    <script src="/js/comment.js" type="module"></script>
    <script src="/js/mod-favorite.js" type="module"></script>
</head>

<body>
    <main class="site-container flex-container-column">
        <header id="header" class="header"></header>

        <p th:if="${responseMessage != null}" th:text="${responseMessage}"></p>

        <article th:if="${responseMessage == null}" id="site" style="width: 100%" >
            <section class="info-container flex-container">

                <div class="game-info flex-container-column">
                    <p class="game-title">
                        <span id="game-title" th:text="${gameName}"></span>
                    </p>

                    <img class="card-image" src="#" th:src="${imgSrc}" alt="Imagem da modificação">

                    <div class="mod-actions flex-container">

                        <a id="download" th:disabled="${authenticated == null}" class="button" th:href="${downloadUrl}">
                            Download
                        </a>

                        <div id="mod-favorite-button" class="button">
                            <span th:classappend ="${isFavorite} ? 'is-favorited'" id="favorite-icon" class="material-symbols-outlined favorite-button">star</span>
                        </div>

                        <a th:href="${'/mods/' + id + '/config'}" th:if="${isUploader}" class="button">
                            <span class="material-symbols-outlined">settings</span>
                        </a>

                    </div>

                    <p id = "response-message" hidden></p>

                </div>

                <div class="mod-info flex-container-column">
                    <div class="mod-info-box">
                        Desenvolvedores: <span th:text="${developerName}"></span>
                    </div>
                    <div class="mod-info-box">
                        Upload feito por: <span th:text="${uploaderName}"></span>
                    </div>
                    <div class="mod-info-box">
                        Downloads: <span th:text="${downloads}"></span>
                    </div>
                    <div class="mod-info-box">
                        Lançamento: <span th:text="${releaseDate}"></span>
                    </div>
                    <div class="mod-info-box">
                        Tamanho: <span th:text="${fileSize}"></span>
                    </div>

                </div>

            </section>

            <div class="section-divider flex-container">
                Descrição
            </div>

            <section th:text="${description}" class="site-body description">
                Descrição vazia
            </section>

            <div class="section-divider flex-container">
                Recursos de Localização/Acessibilidade
            </div>

            <section class="site-body flex-container tag-container">
                <div class="text-input tag-box" th:each="localizationTag : ${localizationTypes}">
                    <span th:text="${localizationTag.getFullName()}"></span>
                </div>

                <div class="text-input tag-box" th:each="disabilityTag : ${disabilityTypes}">
                    <span th:text="${disabilityTag.getFullName()}"></span>
                </div>
            </section>

            <div class="section-divider flex-container" hidden>
                Comentários <span th:text="' (' + ${commentSize} + ')'"></span>
            </div>

            <section class="site-body flex-container-column comment-section">

                <div th:if="${authenticated}" class="comment-container flex-container">
                    <img id='comment-icon' class="comment-icon" src="#" th:src="${userIcon}" alt="Imagem do usuário">

                    <div class="flex-container-column comment-submit-container">
                        <textarea
                                id="comment"
                                class="text-input comment"
                                aria-label="Comentar sobre o mod"
                                placeholder="Envie um comentário..."
                        ></textarea>

                        <button id="comment-submit" class="comment-submit">Comentar</button>
                    </div>
                </div>

                <div class="flex-container comment-container" th:each="comment : ${comments}">
                    <img th:src="${comment.getUserIconSrc()}" class="comment-icon comment-icon-not-user" src="#" alt="Imagem do usuário">

                    <div class="flex-container-column comment-submit-container">
                        <div class="comment-top flex-container">
                            <p th:text="${comment.getUserName()}"></p>
                            <p th:text="${comment.stringSendDate()}"></p>
                        </div>

                        <div class="text-input comment" th:text="${comment.content}"></div>

                        <button
                                th:if="${comment.getUser() != null and comment.getUser().id == userId}"
                                th:data-id="${comment.id}"
                                class="delete-comment"
                        >
                            EXCLUIR COMENTÁRIO
                        </button>
                    </div>


                </div>

            </section>

            
        </article>

    </main>

</body>

</html>
