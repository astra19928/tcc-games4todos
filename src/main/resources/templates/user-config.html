<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuário</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
            rel="stylesheet" />
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/config.css">
    <script src="/js/loadUser.js" type="module"></script>
    <script src="/js/loadHeader.js" type="module"></script>
    <script src="/js/config.js" type="module"></script>
</head>

<body>
<main class="site-container flex-container-column">
    <header id="header" class="header"></header>

    <article class="site-body flex-container-column">

        <form id="user-form" class="flex-container-column upload-form">

            <h2>Informações de conta</h2>

            <div class="horizontal-form-container flex-container">
                <div class="form-container flex-container-column">
                    <input
                            type="text"
                            id="name-create"
                            class="text-input"
                            name="username"
                            aria-label="Criar nome de usuário"
                            placeholder="Nome"
                            th:value="${user.nickname}"
                    />

                    <div
                            class="text-input email-container"
                            th:text="${user.email}"
                    ></div>
                    <input
                            type="password"
                            id="old-password-create"
                            class="text-input"
                            name="old-password"
                            aria-label="Inserir senha antiga"
                            placeholder="Confirmar Senha Antiga"
                    />
                    <input
                            type="password"
                            id="password-create"
                            class="text-input"
                            name="password"
                            aria-label="Criar senha de usuário"
                            placeholder="Nova Senha"
                    />

                    <input
                            type="password"
                            id="password-confirm"
                            class="text-input"
                            name="password"
                            aria-label="Confirmar nova senha de usuário"
                            placeholder="Confirmar Senha Nova"
                    />

                    <fieldset class="disability-fieldset flex-container-column">
                        <legend>Necessidades de acessibilidade (opcional)</legend>

                        <div class="disability-option" th:each="category : ${disabilities}">
                            <label>
                                <input
                                        type="checkbox"
                                        class="disability-checkbox"
                                        th:id="${category.name} + '-check'"
                                        th:data-category="${category.id} + 1"
                                        th:data-target="${category.name} + '-select'"
                                        th:aria-controls="${category.name} + '-select'"
                                        th:checked="${#maps.containsKey(userDisabilitiesMap, category.id)}"
                                        aria-expanded="false"
                                >
                                <span th:text="${category.name}"></span>
                            </label>

                            <select
                                    th:id="${category.name} + '-select'"
                                    class="text-input disability-select"
                                    th:aria-label="'Tipo de ' + ${category.name}"
                            >
                                <option value="" selected disabled>Selecione o tipo</option>
                                <div
                                        class="display-contents"
                                        th:each="type : ${category.getTypes()}">
                                    <option
                                            th:value="${type.id}"
                                            th:text="${type.name}"
                                            th:selected="${type.id == userDisabilitiesMap[category.id]}"></option>
                                </div>

                            </select>
                        </div>

                    </fieldset>

                    <button type="submit" id="user-submit">Realizar Alterações</button>

                    <button type="submit" class="user-delete" id="user-delete">EXCLUIR CONTA</button>


                </div>

                <div class="form-container flex-container-column">
                    <img src="#" th:src="${user.getIconSrc()}" class="uploaded-form-image" id="uploaded-user-image"
                         alt="Pré-visualização do icone do usuário">

                    <div class="label-input-container flex-container-column">
                        <label for="form-image-submit">Insira o seu ícone de usuário</label>
                        <input
                                type="file"
                                id="form-image-submit"
                                accept="image/png, image/jpeg, image/jpg, image/webp"
                        >
                    </div>

                </div>

            </div>

            <p role="alert" id="responseMessage"></p>
        </form>

    </article>
</main>
</body>

</html>
