<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome do Mod Aqui</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
            rel="stylesheet" />
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/upload.css">
</head>

<body>
<main class="site-container flex-container-column">
    <header id="header" class="header"></header>
    <script src="/js/loadHeader.js"></script>

    <div class="site-body">

        <form id="upload-form" class="flex-container-column" enctype="multipart/form-data">
            <h2>Realizar upload de um mod</h2>
            
            <div class="upload-container flex-container">

                <div class="form-container flex-container-column">

                    <input
                            type="text"
                            id="game-name"
                            class="cadastro-text-input"
                            aria-label="Inserir o nome do jogo"
                            placeholder="Nome do jogo"
                    />
                    <input
                            type="text"
                            id="mod-name"
                            class="cadastro-text-input"
                            aria-label="Inserir o titulo do Mod"
                            placeholder="Titulo do mod"
                    />

                    <input
                            type="text"
                            id="mod-developers"
                            class="cadastro-text-input"
                            aria-label="Inserir os nomes dos desenvolvedores aqui"
                            placeholder="Desenvolvedores"
                    />

                    <input
                            type="date"
                            id="mod-release-date"
                            class="cadastro-text-input"
                            aria-label="Inserir a data de lançamento do mod"
                            placeholder="Data de lançamento"
                    />

                    <textarea
                            form="upload-form"
                            id="description"
                            class="cadastro-text-input"
                            aria-label="Inserir uma descrição para o mod"
                            placeholder="Descrição"
                    ></textarea>

                    <div class="label-input-container flex-container-column">
                        <label for="mod-file">Insira o arquivo do mod</label>
                        <input
                                type="file"
                                id="mod-file"
                                aria-label="Inserir o arquivo do mod"
                                placeholder="Arquivo do mod"
                        >
                    </div>
                    
                    <button type="submit" id="user-submit">Realizar Upload</button>

                </div>

                <div class="form-container flex-container-column">
                    <img src="#" class="uploaded-mod-image" id="uploaded-mod-image" alt="Pré-visualização da capa do mod">

                    <div class="label-input-container flex-container-column">
                        <label for="mod-image-submit">Insira a capa do mod</label>
                        <input
                                type="file"
                                id="mod-image-submit"
                                accept="image/png, image/jpeg, image/jpg, image/webp"
                        >
                    </div>
                    
                </div>

            </div>

            <p id="responseMessage"></p>

        </form>

        <script src="/js/upload.js"></script>

    </div>
</main>

</body>

</html>
