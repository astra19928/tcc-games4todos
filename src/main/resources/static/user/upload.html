<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome do Mod Aqui</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
            rel="stylesheet" />
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>

<body>
<main class="site-container flex-container-column">
    <header id="header" class="header"></header>
    <script src="/js/loadHeader.js"></script>

    <div class="site-body">

        <form id="upload-form">

            <div class="upload- flex-container">

                <div class="form-container flex-container-column">
                    <h2>Realizar upload de um mod</h2>

                    <input
                            type="email"
                            id="game-name"
                            class="cadastro-text-input"
                            aria-label="Inserir o nome do jogo"
                            placeholder="Nome do jogo"
                    />
                    <input
                            type="email"
                            id="mod-name"
                            class="cadastro-text-input"
                            name="nome mod"
                            aria-label="Inserir o titulo do Mod"
                            placeholder="Titulo do mod"
                    />

                    <input
                            type="text"
                            id="mod-developers"
                            class="cadastro-text-input"
                            aria-label="Inserir os nomes dos desenvolvedores aqui"
                            placeholder="Desenvolvedores"
                    />

                    <input
                            type="date"
                            id="mod-release-date"
                            class="cadastro-text-input"
                            aria-label="Inserir a data de lançamento do mod"
                            placeholder="Data de lançamento"
                    />

                    <button type="submit" id="user-submit">Submit the flesh</button>

                </div>



            </div>


            <t id="responseMessage"></t>

        </form>

        <script src="/js/upload.js"></script>

    </div>
</main>

</body>

</html>
