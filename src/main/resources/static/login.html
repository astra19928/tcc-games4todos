<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
            rel="stylesheet" />
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
<main class="site-container flex-container-column">
    <header id="header" class="header"></header>
    <script src="js/loadHeader.js"></script>

    <div class="site-body">


        <form id="loginForm">

            <div class="form-container flex-container-column">
                <h2>Realizar Login</h2>

                <input
                        type="email"
                        id="email-login"
                        class="cadastro-text-input"
                        name="email"
                        aria-label="Inserir e-mail"
                        placeholder="E-mail"
                />

                <input
                        type="text"
                        id="password-login"
                        class="cadastro-text-input"
                        name="password"
                        aria-label="Inserir senha"
                        placeholder="Senha"
                />

                <a class="no-account-text" href="cadastro.html">Não tenho uma conta</a>

                <button type="submit" id="user-submit">Submit the flesh</button>

            </div>

            <t id="responseMessage"></t>

        </form>

        <script src="js/login.js"></script>

    </div>
</main>

</body>

</html>
