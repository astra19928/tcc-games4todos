<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star&display=block"
            rel="stylesheet" />
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
<main class="site-container flex-container-column">
    <header class="header">

    </header>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script type="text/javascript">
        $('.header').load('header.html');
    </script>


    <div class="site-body">

        <h2>Criar Conta</h2>

        <form id="loginForm">

            <div class="form-container flex-container-column">
                <input
                        type="email"
                        id="email-login"
                        class="cadastro-text-input"
                        name="email"
                        aria-label="Inserir e-mail"
                        placeholder="E-mail"
                />

                <input
                        type="text"
                        id="password-login"
                        class="cadastro-text-input"
                        name="password"
                        aria-label="Inserir senha"
                        placeholder="Senha"
                />
                <button type="submit" id="user-submit">Submit the flesh</button>
            </div>

            <t id="responseMessage"></t>
        </form>

        <script src="scripts/cadastro.js"></script>

    </div>
</main>

</body>

</html>
