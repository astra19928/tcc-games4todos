    <title>Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"

<body>
<main class="site-container flex-container-column">

    <header id="header" class="header"></header>

    <div class="site-body">

        <form id="user-form">

            <div class="form-container flex-container-column">

                <h2>Criar Conta</h2>

                <input
                        type="text"
                        id="name-create"
                        class="text-input"
                        name="username"
                        aria-label="Criar nome de usuário"
                        placeholder="Nome"
                />

                <input
                        type="email"
                        id="email-create"
                        class="text-input"
                        name="email"
                        aria-label="Criar email de usuário"
                        placeholder="E-mail"
                />

                <input
                        type="text"
                        id="password-create"
                        class="text-input"
                        name="password"
                        aria-label="Criar senha de usuário"
                        placeholder="Senha"
                />

                    <label for="form-image-submit">Insira o seu ícone de usuário</label>
