<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght@0..1,100..700&icon_names=search,comment,star,settings,account_circle&display=block"
          rel="stylesheet" />
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/forms.css">
    <script src="/js/loadUser.js" type="module"></script>
    <script src="/js/loadHeader.js" type="module"></script>
</head>
<body>
<main class="site-container flex-container-column">

    <header id="header" class="header"></header>

    <div class="site-body">

        <form id="user-form">

            <div class="form-container flex-container-column">

                <h2>Criar Conta</h2>

                <input
                        type="text"
                        id="name-create"
                        class="text-input"
                        name="username"
                        aria-label="Criar nome de usuário"
                        placeholder="Nome"
                />

                <input
                        type="email"
                        id="email-create"
                        class="text-input"
                        name="email"
                        aria-label="Criar email de usuário"
                        placeholder="E-mail"
                />

                <input
                        type="password"
                        id="password-create"
                        class="text-input"
                        name="password"
                        aria-label="Criar senha de usuário"
                        placeholder="Senha"
                />

                <fieldset class="disability-fieldset flex-container-column">
                    <legend>Necessidades de acessibilidade (opcional)</legend>

                    <div class="disability-option">
                        <label>
                            <input
                                    type="checkbox"
                                    class="disability-checkbox"
                                    id="low-vision-check"
                                    data-category="1"
                                    data-target="low-vision-select"
                                    aria-controls="low-vision-select"
                                    aria-expanded="false"
                            >
                            Visão baixa
                        </label>
                        <select id="low-vision-select" class="text-input disability-select"
                                aria-label="Tipo de visão baixa" hidden>
                            <option value="" selected disabled>Selecione o tipo</option>
                            <option value="1">Cegueira total</option>
                            <option value="2">Visão monocular</option>
                            <option value="3">Baixa acuidade visual</option>
                            <option value="4">Redução do campo visual</option>
                            <option value="5">Sensibilidade à luz</option>
                        </select>
                    </div>

                    <div class="disability-option">
                        <label>
                            <input
                                    type="checkbox"
                                    class="disability-checkbox"
                                    id="color-blindness-check"
                                    data-category="2"
                                    data-target="color-blindness-select"
                                    aria-controls="color-blindness-select"
                                    aria-expanded="false"
                            >
                            Daltonismo
                        </label>
                        <select id="color-blindness-select" class="text-input disability-select"
                                aria-label="Tipo de daltonismo" hidden>
                            <option value="" selected disabled>Selecione o tipo</option>
                            <option value="6">Protanopia</option>
                            <option value="7">Protanomalia</option>
                            <option value="8">Deuteranopia</option>
                            <option value="9">Deuteranomalia</option>
                            <option value="10">Tritanopia</option>
                            <option value="11">Tritanomalia</option>
                            <option value="12">Acromatopsia (monocromacia)</option>
                        </select>
                    </div>

                    <div class="disability-option">
                        <label>
                            <input
                                    type="checkbox"
                                    class="disability-checkbox"
                                    id="hearing-loss-check"
                                    data-category="3"
                                    data-target="hearing-loss-select"
                                    aria-controls="hearing-loss-select"
                                    aria-expanded="false"
                            >
                            Perda auditiva
                        </label>
                        <select id="hearing-loss-select" class="text-input disability-select"
                                aria-label="Tipo de perda auditiva" hidden>
                            <option value="" selected disabled>Selecione o tipo</option>
                            <option value="13">Surdez total</option>
                            <option value="14">Perda auditiva leve</option>
                            <option value="15">Perda auditiva moderada</option>
                            <option value="16">Perda auditiva severa</option>
                            <option value="17">Perda auditiva unilateral</option>
                        </select>
                    </div>
                </fieldset>

                <button type="submit" id="user-submit">Realizar Cadastro</button>
            </div>

            <div class="form-container flex-container-column">
                <img src="#" class="uploaded-form-image" id="uploaded-user-image" alt="Pré-visualização do icone do usuário">

                <div class="label-input-container flex-container-column">
                    <label for="form-image-submit">Insira o seu ícone de usuário</label>
                    <input
                            type="file"
                            id="form-image-submit"
                            accept="image/png, image/jpeg, image/jpg, image/webp"
                    >
                </div>

            </div>

            <p role="alert" id="responseMessage"></p>
        </form>

        <script src="js/cadastro.js"></script>

    </div>
</main>

</body>
</html>
