
<div class="header-top flex-container">

    <a href="/login.html" id="header-user" class="header-user flex-container">

        <div class="icon-container flex-container">
            <span id="user-symbol" class="material-symbols-outlined">account_circle</span>
            <img alt="user" class="icon" id="user-icon">
        </div>

        <div id="user-name" class="user-name">Login</div>
    </a>

    <div class="logo-padding">
        <a href="/index.html" class="logo">
            <p>Games4Todos</p>
        </a>
    </div>

    <div class="header-user flex-container hidden">

        <div class="icon-container">
            <img alt="Ícone do usuário" class="icon" src="images/user.svg">
        </div>

        <t>Login</t>
    </div>
</div>

<div class="header-bottom flex-container">
    <div class="header-action flex-container">
        <span class="material-symbols-outlined">star</span>

        <t>Favoritos</t>
    </div>

    <div class="header-action flex-container">
        <span class="material-symbols-outlined">comment</span>

        <t>Respostas</t>
    </div>

    <div class="header-action search-bar flex-container">
        <label for="search-submit" class="search-icon">
            <span class="material-symbols-outlined">search</span>
        </label>

        <form class="search-form" action="/modificacao.html" method="GET" role="search">
            <input
                type="search"
                id="site-search"
                class="search-bar-input"
                name="q"
                placeholder="Pesquisar (ir pagina mod, temporario)"
                aria-label="Pesquise por um mod"
            />
            <button type="submit" id="search-submit" style="display: none;"></button>
        </form>

    </div>
</div>
